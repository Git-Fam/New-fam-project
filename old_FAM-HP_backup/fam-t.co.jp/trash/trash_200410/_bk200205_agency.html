	<section class="wrap sbox">
		<h2><img src="./img/tit_agency_h2.jpg" height="89" width="323" alt="AGENCY"></h2>
		<ul>
			<li><img src="./img/txt_agency_content1.jpg" height="222" width="672" alt="すぐに販売できる　弊社はお客様に合った商材を早く準備し、すぐに販売出来ます。代理店のメリットはすぐに販売出来る。売り上げや収入がすぐに欲しい、自社でその商品・サービスの仕組みを作るのにはどうしても時間がかかるものです。代理店としてはじめればその時間は短縮できます。弊社では独自の研修、成果が出るまでの研修を充実しております。"></li>
			<li><img src="./img/txt_agency_content2.jpg" height="222" width="672" alt="リスクがすくない　商品・サービスを資金をかけて開発する必要はありません。リスクなくビジネスをはじめられます。リスクがゼロから始められます。自社ビジネスを始めようとすればコストはかかるものです。初期費用等かかるものも御座いますが、何に対しての費用かご確認の上様々な商材から選んで頂きます。"></li>
			<li><img src="./img/txt_agency_content3.jpg" height="242" width="672" alt="自由にできる　売り方に制限がない場合が多いため、又ノルマ等が御座いません。なので売れないと判断した場合すぐにやめられるという点も魅力です。通常案件はノルマ、販売方法が御座いますが、弊社で取り扱っている案件は販売方法が代理店にゆだねられています。そのため自由に販売出来ます。"></li>
		</ul>
	</section><!-- .wrap=END -->
