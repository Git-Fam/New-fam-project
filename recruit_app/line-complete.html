<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE連携完了</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="compact-screen">
      <section class="app-shell jobs-shell">
        <p class="eyebrow">LINE connected</p>
        <!-- completeTitle jsで使用中 -->
        <h1 class="complete-title" id="completeTitle">診断結果をLINEに送信しました。</h1>
        <!-- completeCopy jsで使用中 -->
        <p id="completeCopy">詳細な診断結果、求人情報、希望条件アンケートをLINEで確認できます。</p>
        <!-- completeLink jsで使用中 -->
        <a class="primary-button complete-link" id="completeLink" href="./index.html#result">結果カードを見る</a>
        <nav class="legal-links legal-links-dark" aria-label="法務リンク">
          <a href="./terms.html" target="_blank" rel="noopener">利用規約</a>
          <a href="./privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
        </nav>
      </section>
    </main>
    <script>
      const DIAGNOSIS_DRAFT_KEY = "ai-career-diagnosis-draft";
      const LINE_CONNECTION_KEY = "ai-career-line-connection";
      const params = new URLSearchParams(window.location.search);
      const status = params.get("status");
      const message = params.get("message");
      const diagnosisId = params.get("diagnosisId");
      const lineConnectionId = params.get("lineConnectionId");

      if (status === "sent" && diagnosisId) {
        const now = new Date().toISOString();
        localStorage.setItem(
          LINE_CONNECTION_KEY,
          JSON.stringify({
            diagnosisId,
            lineConnectionId: lineConnectionId || null,
            lastSentDiagnosisId: diagnosisId,
            linkedAt: now,
            savedAt: now
          })
        );

        try {
          const draft = JSON.parse(localStorage.getItem(DIAGNOSIS_DRAFT_KEY) || "null");
          if (draft?.diagnosisId === diagnosisId) {
            localStorage.setItem(
              DIAGNOSIS_DRAFT_KEY,
              JSON.stringify({
                ...draft,
                status: "sent",
                lineSentAt: now
              })
            );
          }
        } catch {
          // localStorageのドラフト更新に失敗してもLINE送信自体は完了しています。
        }
      }

      if (status && status !== "sent") {
        document.querySelector("#completeTitle").textContent = "LINE連携に失敗しました。";
        document.querySelector("#completeCopy").textContent =
          status === "expired"
            ? "認証の有効期限が切れました。診断ページに戻ってもう一度お試しください。"
            : message || "認証情報を確認できませんでした。診断ページに戻ってもう一度お試しください。";
        document.querySelector("#completeLink").textContent = "診断ページに戻る";
        document.querySelector("#completeLink").setAttribute("href", "./index.html");
      }
    </script>
  </body>
</html>
