<!doctype html>
<html lang="ja">

<head prefix="og: https://ogp.me/ns#">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ▼TELL&MAIL&ADDRESSの自動リンク機能を制御 -->
    <meta name="format-detection" content="email=no,telephone=no,address=no" />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta property="og:locale" content="ja_JP" />

    <!-- ▼SEO -->
    <link rel="”canonical”" href="”URL”" />
    <!-- ジェネレーターURL→ https://metatags.io/ -->

    <!-- ▼ファビコン -->
    <!-- ジェネレーターURL→ https://realfavicongenerator.net/ -->

    <!-- ▼クロールして欲しくない -->
    <!-- <meta name="robots" content="noindex,nofollow"> -->

    <!-- ▼テーマカラー -->
    <!-- <meta name="theme-color" content="#e9c931"> -->

    <!-- ▼CSS -->
    <link rel="stylesheet" href="css/reset.css?ver=1.0.0" />
    <link rel="stylesheet" href="css/main.css?ver=1.0.0" />

    <!-- ▼フォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+JP:wght@100..900&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header is-ather">
        <div class="header__inner">
            <h1 class="header__logo"><a href="#" class=" hover-opa">aitec</a></h1>

            <div class="header__group">
                <nav class="header__nav">
                    <ul class="header__list">
                        <li class="header__item"><a href="#" class="header__link  hover-opa">サービス</a></li>
                        <li class="header__item"><a href="#" class="header__link  hover-opa">会社概要</a></li>
                    </ul>
                </nav>

                <a href="#" class="header__button hover-opa">お問い合わせ</a>
            </div>
        </div>
    </header>

    <div class="whopper">

        <!-- 個別 - start -->
        <div class="contact-page">


            <section class="contact-page__content">
                <div class="contact-page__content-inr">

                    <div class="contact-page__text">
                        <p class="contact-page__label">CONTACT</p>
                        <h2 class="contact-page__title">お問い合わせ</h2>
                        <p class="contact-page__desc">
                            サービスに関するご質問やご相談など、<br>
                            お気軽にお問い合わせください。
                        </p>
                    </div>

                    <div class="C_form">
                        <form action="" method="post">
                            <div class="C_form-row-wrap">
                                <div class="C_form-row">
                                    <label class="C_form-label" for="company">会社名</label>
                                    <input class="C_form-input" type="text" id="company" name="company">
                                </div>

                                <div class="C_form-row">
                                    <label class="C_form-label" for="name">氏名</label>
                                    <input class="C_form-input" type="text" id="name" name="name">
                                </div>

                                <div class="C_form-row">
                                    <label class="C_form-label" for="email">メールアドレス</label>
                                    <input class="C_form-input" type="email" id="email" name="email">
                                </div>

                                <div class="C_form-row C_form-row--textarea">
                                    <label class="C_form-label" for="message">お問い合わせ内容</label>
                                    <textarea class="C_form-textarea" id="message" name="message"></textarea>
                                </div>

                                <div class="C_form-agree">
                                    <input class="C_form-checkbox" type="checkbox" id="agree" name="agree">
                                    <label class="C_form-agree-label" for="agree">プライバシーポリシーに同意する</label>
                                </div>

                                <button type="submit" class="C_form-submit hover-opa">送信する</button>

                            </div>
                        </form>
                    </div>

                </div>
            </section>

        </div>
        <!-- 個別 - end -->


        <footer class="footer">
            <div class="footer__inner">
                <div class="footer__top">
                    <div class="footer__top-inner">
                        <a href="#" class="footer__logo hover-opa">aitec</a>
    
                        <nav class="footer__nav">
                            <ul class="footer__list">
                                <li class="footer__item"><a href="#" class="footer__link hover-opa">サービス</a></li>
                                <li class="footer__item"><a href="#" class="footer__link hover-opa">会社概要</a></li>
                                <li class="footer__item"><a href="#" class="footer__link hover-opa">お問い合わせ</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
                <div class="footer__bottom">
                    <div class="footer__bottom-inner">
                        <p class="footer__copyright">©aitec.inc</p>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"
        integrity="sha256-2Pmvv0kuTBOenSvLm6bvfBSSHrUJ+3A7x6P5Ebd07/g=" crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
