<svg xmlns="http://www.w3.org/2000/svg" width="848" height="353.5" viewBox="0 0 848 353.5">
  <g id="グループ_59706" data-name="グループ 59706" transform="translate(-26.82 -297.5)">
    <text id="クラブ活動" transform="translate(383.32 420)" fill="#fff" stroke="#fff" stroke-width="0.5" font-size="25" font-family="PA1GothicStdN-Medium, A P-OTF A1Gothic StdN" font-weight="500" letter-spacing="0.1em"><tspan x="0" y="0">クラブ活動</tspan></text>
    <text id="仲間と夢中になれる場所_" data-name="仲間と夢中になれる場所。" transform="translate(28.32 356)" fill="#fff" stroke="#fff" stroke-width="1.5" font-size="65" font-family="PA1GothicStdN-Medium, A P-OTF A1Gothic StdN" font-weight="500" letter-spacing="0.09em"><tspan x="0" y="0">仲間と夢中になれる場所。</tspan></text>
    <g id="グループ" transform="translate(275)">
      <text id="放課後は_夢中になれる時間のはじまりです_" data-name="放課後は、夢中になれる時間のはじまりです。" transform="translate(-59.2 529)" fill="#fff" font-size="18" font-family="PA1GothicStdN-Medium, A P-OTF A1Gothic StdN" font-weight="500" letter-spacing="0.14em"><tspan x="0" y="0">放課後は、夢中になれる時間のはじまりです。</tspan></text>
      <text id="仲間と笑い合い_ときには本気でぶつかりながら一つの目標に向かって挑戦する_" data-name="仲間と笑い合い、ときには本気でぶつかりながら一つの目標に向かって挑戦する。" transform="translate(-223.18 569)" fill="#fff" font-size="18" font-family="PA1GothicStdN-Medium, A P-OTF A1Gothic StdN" font-weight="500" letter-spacing="0.14em"><tspan x="0" y="0">仲間と笑い合い、ときには本気でぶつかりながら一つの目標に向かって挑戦する。</tspan></text>
      <text id="その経験は技術だけでなく_自信や協調性_挑戦する力も育ててくれます_" data-name="その経験は技術だけでなく、自信や協調性、挑戦する力も育ててくれます。" transform="translate(-192.49 609)" fill="#fff" font-size="18" font-family="PA1GothicStdN-Medium, A P-OTF A1Gothic StdN" font-weight="500" letter-spacing="0.14em"><tspan x="0" y="0">その経験は技術だけでなく、自信や協調性、挑戦する力も育ててくれます。</tspan></text>
      <text id="あなたも_仲間と自分だけの夢中を見つけてみませんか_" data-name="あなたも、仲間と自分だけの夢中を見つけてみませんか？" transform="translate(-110.59 649)" fill="#fff" font-size="18" font-family="PA1GothicStdN-Medium, A P-OTF A1Gothic StdN" font-weight="500" letter-spacing="0.14em"><tspan x="0" y="0">あなたも、仲間と自分だけの夢中を見つけてみませんか？</tspan></text>
